# Supabase pauses free projects after about a week with no activity. This asks
# the database one cheap question every three days so that does not happen.
# Needs two repository secrets (Settings > Secrets and variables > Actions),
# the same values as VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY on Vercel:
#   SUPABASE_URL, SUPABASE_ANON_KEY
# The anon key is public by design; row-level security means this query
# returns an empty list for anyone who is not signed in.

name: Keep Supabase awake

on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Add SUPABASE_URL and SUPABASE_ANON_KEY as repository secrets."
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            "${SUPABASE_URL%/}/rest/v1/user_progress?select=item_id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
          echo
          echo "Supabase answered."
