<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face { font-family: 'New Spirit'; src: url('../../public/fonts/NewSpirit-Regular.otf') format('opentype'); font-weight: 400; }
      @font-face { font-family: 'New Spirit'; src: url('../../public/fonts/NewSpirit-SemiBold.otf') format('opentype'); font-weight: 600; }
      * { box-sizing: border-box; margin: 0; }
      body {
        width: 1200px; height: 630px; padding: 64px 72px;
        display: flex; flex-direction: column; justify-content: space-between;
        font-family: 'New Spirit', serif; color: #2447b8; background-color: #fbe88a;
        background-image:
          linear-gradient(rgba(36, 71, 184, 0.09) 1px, transparent 1px),
          linear-gradient(90deg, rgba(36, 71, 184, 0.09) 1px, transparent 1px);
        background-size: 56px 56px;
      }
      .brand { display: flex; align-items: center; gap: 18px; font-size: 40px; font-weight: 600; }
      .brand svg { width: 56px; height: 56px; }
      h1 { font-weight: 400; font-size: 104px; line-height: 1.02; letter-spacing: -0.02em; max-width: 1020px; }
      .foot { display: flex; justify-content: space-between; font-size: 34px; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" fill="#2447b8"/><path d="M22 51V14h12a11.5 11.5 0 0 1 0 23H22" fill="none" stroke="#fbe88a" stroke-width="7.5"/></svg>
      Product Practice
    </div>
    <h1>Prep for your first product interview.</h1>
    <div class="foot"><span>Free. No sign-up needed.</span><span>Built in India</span></div>
  </body>
</html>
